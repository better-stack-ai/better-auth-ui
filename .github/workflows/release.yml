name: Better Auth UI Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Resolve release metadata
        id: release-metadata
        env:
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG_VERSION="${RAW_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          NPM_DIST_TAG=latest
          if [[ "$PKG_VERSION" == *-* || "$GITHUB_PRERELEASE" == "true" ]]; then
            NPM_DIST_TAG=next
          fi

          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$NPM_DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing @btst/better-auth-ui@$PKG_VERSION with dist-tag '$NPM_DIST_TAG'"

      - name: Publish to NPM
        run: npm publish --access public --tag "${{ steps.release-metadata.outputs.npm_dist_tag }}"
